# Gradle 配置文件
# 抑制 compileSdk=35 与 AGP 8.5.2 的兼容性警告
android.suppressUnsupportedCompileSdk=35
# AndroidX 支持开关：项目全部使用 androidx.* 命名空间（compose/lifecycle/navigation/
# security-crypto），缺此项 AGP BooleanOption USE_ANDROID_X 默认为 false，
# AndroidXDependencyCheck 直接报错阻断构建
android.useAndroidX=true
# 允许在非 Apple 机器上配置 iOS 目标（仅配置不编译）
kotlin.native.ignoreDisabledTargets=true
